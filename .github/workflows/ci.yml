name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/*.json hooks/hooks.json; do jq empty "$f"; done
      - name: Version is semver
        run: jq -er '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' .claude-plugin/plugin.json
      # ponytail: latest CLI on purpose, the mod API is early access and this catches a break first.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate .
      - name: Test
        run: claude plugin test .
